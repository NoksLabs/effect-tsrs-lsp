id = "effect-tsrs"
name = "Effect tsrs"
description = "TypeScript language server via the Effect-patched tsrs (Rust port of TypeScript 7): full type inference plus Effect diagnostics."
version = "0.1.0"
schema_version = 1
authors = ["NoksLabs"]
repository = "https://github.com/NoksLabs/effect-tsrs-zed"

[language_servers.effect-tsrs]
name = "effect-tsrs"
# tsrs picks the script kind from the LSP languageId sent in textDocument/didOpen.
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
